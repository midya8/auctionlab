[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "auctionlab-finite"
version = "0.1.0"
description = "Exact finite combinatorial auction with independent evidence replay"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
auctionlab = "auctionlab.__main__:main"
[tool.setuptools]
packages = ["auctionlab"]
